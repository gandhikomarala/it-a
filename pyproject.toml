[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "backend*", "ml*", "apps*"]
exclude = ["tests*", "scripts*", "infrastructure*", "data*", "artifacts*", "docs*"]

[project]
name = "churn-mlops-platform"
version = "1.0.0"
description = "Enterprise Customer Churn Prediction & MLOps Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MLOps Engineering Team", email = "engineering@enterprise-mlops.io" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "redis>=5.0.3",
    "celery>=5.3.6",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "scikit-learn>=1.4.1.post1",
    "lightgbm>=4.3.0",
    "shap>=0.45.0",
    "joblib>=1.3.2",
    "pyarrow>=15.0.0",
    "scipy>=1.12.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.2",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "click>=8.1.7",
    "typer>=0.9.0",
    "rich>=13.7.1",
    "tabulate>=0.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.2",
    "black>=24.2.0",
    "mypy>=1.9.0",
    "locust>=2.24.1",
    "factory-boy>=3.3.0",
    "faker>=24.2.0"
]

[project.scripts]
churnctl = "apps.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
