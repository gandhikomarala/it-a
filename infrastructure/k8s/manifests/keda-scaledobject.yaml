# Kubernetes Manifest: keda-scaledobject.yaml
# KEDA Event-driven autoscaling for Celery background workers based on Redis queue depth.

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: churn-worker-scaler
spec:
  scaleTargetRef:
    name: churn-worker
  minReplicaCount: 2
  maxReplicaCount: 30
  triggers:
    - type: redis
      metadata:
        address: redis:6379
        listName: celery
        listLength: "20"
